<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="oxyuan">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .track { stroke: #e6edf3; stroke-opacity: 0.14; }
    .beam { animation: beam 7s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes beam {
      0%   { transform: translateX(-240px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(1000px); opacity: 0; }
    }
    .caret { animation: caret 1.2s steps(1) infinite; }
    @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="492" y="86" font-size="46" font-weight="600" letter-spacing="16" fill="#e6edf3" text-anchor="middle">OXYUAN</text>
    <rect class="caret" x="648" y="52" width="3" height="40" fill="#58a6ff"/>
    <text x="497" y="124" font-size="12" letter-spacing="5" fill="#8d96a0" text-anchor="middle">大山 / GITHUB.COM/OXYUAN</text>
    <line class="track" x1="0" y1="160" x2="1000" y2="160" stroke-width="1"/>
    <rect class="beam" x="0" y="158.5" width="240" height="3" fill="url(#sweep)"/>
  </g>
</svg>
